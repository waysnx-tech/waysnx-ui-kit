name: Release (npm publish)

# Manual, explicit release workflow for publishing the WaysNX UI Kit
# workspace packages to the public npm registry.
#
# Design goals (see docs/release/1.0.0_TASKS_4-7_REPORT.md):
#   - Never publishes automatically. Only via manual `workflow_dispatch`.
#   - No long-lived NPM_TOKEN. Authentication uses npm Trusted Publishing
#     (OIDC), which mints a short-lived, workflow-scoped credential and
#     attaches provenance automatically.
#   - Validation -> build -> package verification -> publication, as
#     distinct, ordered jobs. Publication only runs if everything before
#     it passed.
#   - Uses pnpm for the workspace release so `workspace:*` specifiers are
#     rewritten to concrete versions (1.0.0) in the published tarballs.
#   - Least-privilege GitHub permissions; `id-token: write` is granted
#     only to the publish job that actually needs OIDC.
#
# PREREQUISITES (configured outside this file, one-time):
#   - Each @waysnx/* package must have a Trusted Publisher configured on
#     npmjs.com that points at THIS repository + THIS workflow filename
#     (release.yml) + the `release` environment.
#   - A GitHub Environment named `release` should be created and protected
#     with required reviewers so a human must approve each publish run.
#   - npm CLI >= 11.5.1 is required for OIDC Trusted Publishing; this
#     workflow pins a Node version that ships a compatible npm and also
#     upgrades npm explicitly in the publish job.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version to validate against (e.g. 1.0.0). Must match every publishable package version."
        required: true
        default: "1.0.0"
      dry_run:
        description: "Dry run only (pack + publish --dry-run, no upload)."
        type: boolean
        required: true
        default: true

# Least privilege by default. Individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.11.0
  NODE_VERSION: 24

jobs:
  # 1. VALIDATION -------------------------------------------------------
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify workspace resolution
        run: pnpm list --recursive --depth=0

      - name: Validate package metadata (19 packages @ 1.0.0)
        run: node scripts/ci-validate-packages.js

      - name: Verify requested release tag matches package versions
        run: |
          REQUESTED="${{ github.event.inputs.release_tag }}"
          echo "Requested release tag: $REQUESTED"
          MISMATCH=0
          for pkg in packages/*/package.json; do
            NAME=$(node -p "require('./$pkg').name")
            VER=$(node -p "require('./$pkg').version")
            if [ "$VER" != "$REQUESTED" ]; then
              echo "::error::$NAME is at $VER but release tag is $REQUESTED"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -ne 0 ]; then
            echo "::error::Package versions do not all match the requested release tag."
            exit 1
          fi
          echo "All publishable package versions match $REQUESTED."

      - name: Scan for committed secrets and credentials
        run: bash scripts/ci-security-check.sh

  # 2. BUILD ------------------------------------------------------------
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm build

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: packages/*/dist/
          retention-days: 3

  # 3. PACKAGE VERIFICATION --------------------------------------------
  verify-packages:
    name: Verify package tarballs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm build

      - name: Pack dry-run for every publishable package
        run: |
          echo "=== pnpm publish --dry-run (no upload) ==="
          # Rewrites workspace:* -> concrete versions and prints tarball contents.
          pnpm -r --filter "@waysnx/*" publish --dry-run --no-git-checks --access public

      - name: Assert no source/test/secret files in tarballs
        run: |
          echo "=== Inspecting packed file lists ==="
          FAIL=0
          for dir in packages/*/; do
            NAME=$(node -p "try{require('./${dir}package.json').name}catch(e){''}")
            [ -z "$NAME" ] && continue
            case "$NAME" in @waysnx/*) ;; *) continue ;; esac
            FILES=$(cd "$dir" && npm pack --dry-run --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log((j[0].files||[]).map(f=>f.path).join('\n'))}catch(e){process.exit(0)}})")
            if echo "$FILES" | grep -E '(^|/)(src/|tests?/|test-results/|coverage/|\.env|\.npmrc|playwright)' >/dev/null; then
              echo "::error::$NAME tarball includes disallowed files:"
              echo "$FILES" | grep -E '(^|/)(src/|tests?/|test-results/|coverage/|\.env|\.npmrc|playwright)'
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "No source/test/secret files found in any tarball."

  # 4. PUBLICATION ------------------------------------------------------
  publish:
    name: Publish to npm (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    needs: verify-packages
    # Protected environment gates ONLY the real publish (dry_run=false), so a
    # human reviewer must approve each actual publication. A dry run
    # (dry_run=true) uploads nothing, needs no token, and mints no OIDC
    # credential, so it deliberately does NOT enter the `release` environment —
    # this keeps the dry-run path unattended and avoids requiring the protected
    # environment to exist for validation runs.
    environment: ${{ github.event.inputs.dry_run == 'false' && 'release' || '' }}
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and provenance on the real
      # publish. Harmless on the dry-run path (no credential is minted).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure OIDC-capable npm (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all publishable packages
        run: pnpm build

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN — no packages will be uploaded."
          pnpm -r --filter "@waysnx/*" publish --dry-run --no-git-checks --access public

      - name: Publish to npm with provenance (OIDC)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        # pnpm publishes workspace packages in dependency (topological)
        # order, so the ui-media -> ui-security edge and the ui-i18n base
        # dependency are satisfied automatically. Trusted Publishing means
        # no NPM_TOKEN is needed; provenance is attached where supported.
        run: |
          pnpm -r --filter "@waysnx/*" publish --no-git-checks --access public --provenance

  # SUMMARY -------------------------------------------------------------
  release-status:
    name: Release Status
    runs-on: ubuntu-latest
    needs: [validate, build, verify-packages, publish]
    if: always()
    steps:
      - name: Check release status
        run: |
          if [[ "${{ needs.validate.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.verify-packages.result }}" != "success" || \
                "${{ needs.publish.result }}" != "success" ]]; then
            echo "::error::Release workflow failed. Check job results above."
            exit 1
          fi
          echo "Release workflow completed successfully."
